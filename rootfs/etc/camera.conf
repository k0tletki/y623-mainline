# camrtsp options: -s WxH (1920x1080 = HomeKit max; 2304x1296 = full sensor),
# -S WxH low-resolution sub-stream (default 640x360, rtsp://<camera>/sub,
#   own scaler on the uncorrected full view; -S 0 = off),
# -f fps (sensor runs 30), -q QP (lower = better/bigger), -g GOP (frames
# between IDRs; a new client always gets an immediate IDR), -p RTSP port,
# -a AE target mean luma (0 = auto exposure off), -F mains Hz for
# anti-flicker exposure steps (50, 60, 0 = off), -G max analogue gain (x).
# Audio (track1, L16 PCM): -A off, -r sample rate (16000), -m mic gain 0..31
# (driver default 23), -E l16|pcmu|pcma (G.711 is 8 kHz; ONVIF clients that
# want an audio encoder config need pcmu/pcma).
# Day/night: -M auto|day|night (ONVIF IrCutFilter can change it at runtime).
# auto decides from the picture: scene light = luma at full exposure, unity
# gain (see /tmp/camrtsp.status); -n night threshold (8), -d day threshold
# (40, must also be 4x the IR-only level). -N/-D use a light-sensor ADC
# instead (this unit has none).
# Lens correction (EISE hardware, +12 ms latency, +7 MB RAM):
#   -L f<focal>[,zoom]  fisheye -> rectilinear; f1100 fits this lens (~100 deg
#                       across 1920 px, fitted on straight room edges); zoom
#                       0.92..1.0 (smaller keeps more view but runs out of
#                       picture at the top/bottom edge).
#   -L k1[,k2[,zoom]]   mild radial polynomial instead (e.g. -0.15).
# Remove -L for the raw lens image.
# -P ms: publish a sub-stream frame for the person detector this often (0/absent = off)
CAMRTSP_ARGS="-s 1920x1080 -f 30 -q 30 -g 60 -a 70 -F 50 -G 16 -L f1100,0.95 -P 250"
# Camera driver (ISP) options: gamma=0 linear, 1 identity (test), 2 sRGB,
# 3 BT.709 + mild contrast (default); gamma_black (1/1000, default 60);
# ccm=0 off, 1..3 stock GC3003 colour matrices (default 3);
# wb_red/wb_blue (x/256), black_level.
VIN_ARGS="gamma=3 gamma_black=60 ccm=3"
# Person + cat detection on the NPU (persond, YOLOv5n on the sub-stream; needs
# -P above). PERSOND=0 turns it off. Model: yolov5n.nnp on the SD card (read once).
# -i ms between frames (250), -t min person score (0.45), -T min cat score (0.3;
# cats score lower at 320x192), -n frames to switch on (2), -H seconds without a
# detection to switch off (10). Plain-HTTP URL fetched on each change:
#   -u / -U  person appears / is gone,  -a / -A  cat appears / is gone
# e.g. homebridge-camera-ffmpeg with "porthttp":
#   -u "http://<homebridge>:<porthttp>/motion?<Camera%20Name>"
#   -U "http://<homebridge>:<porthttp>/motion/reset?<Camera%20Name>"
# State: /tmp/person.state; ONVIF: PullPoint events from onvifd
# (CellMotionDetector/Motion with Rule PersonDetector / CatDetector,
# VideoSource/MotionAlarm = either).
PERSOND=1
PERSOND_ARGS="-i 250 -t 0.45 -T 0.3 -n 2 -H 10"
